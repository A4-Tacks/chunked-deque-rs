name: bench

permissions:
  contents: write

on:
  push:
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo bench --package benches --features multi | tee out
      - run: ./benches/difference.jq out

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo bench --package benches --features multi | tee out
      - run: Invoke-WebRequest -Uri "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-win64.exe" -OutFile "jq.exe"
      - run: ./jq -nrRf ./benches/difference.jq out
